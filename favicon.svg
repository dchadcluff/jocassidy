<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="jcVoidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#220b14"/>
      <stop offset="70%" stop-color="#0e0712"/>
      <stop offset="100%" stop-color="#07050a"/>
    </radialGradient>
    <linearGradient id="jcCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b50"/>
      <stop offset="50%" stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="#7a0d1f"/>
    </linearGradient>
    <linearGradient id="jcSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#b8ad9e"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Void background circle with blood-red edge -->
  <circle cx="32" cy="32" r="30" fill="url(#jcVoidGlow)" stroke="url(#jcCrimson)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#9b1a2a" stroke-width="0.75" opacity="0.45"/>

  <!-- Ornate 'J' in silver parchment -->
  <path d="M 26 15 L 30.5 15 L 30.5 38 C 30.5 43.5 27.5 47 22 47 C 17.5 47 15 44 14.5 40.5 L 18 39.5 C 18.5 41.5 20 43.5 22 43.5 C 25 43.5 26.5 41 26.5 37.5 Z" fill="url(#jcSilver)"/>

  <!-- Ornate 'C' in glowing blood crimson -->
  <path d="M 48 23 C 45.5 18 40.5 15 34 15 C 23.5 15 17.5 23 17.5 32 C 17.5 41 23.5 49 34 49 C 41.5 49 46.5 45 48.5 40 L 44.5 38.5 C 43 42 39 45 34 45 C 26 45 22 39 22 32 C 22 25 26 19 34 19 C 39 19 42.5 21.5 44.5 25 Z" fill="url(#jcCrimson)" filter="url(#crimsonGlow)"/>

  <!-- Crimson Ink Drop at the tip of J -->
  <path d="M 16.5 43.5 C 16.5 43.5 13.5 46.5 13.5 48.5 C 13.5 50.2 14.8 51.5 16.5 51.5 C 18.2 51.5 19.5 50.2 19.5 48.5 C 19.5 46.5 16.5 43.5 16.5 43.5 Z" fill="url(#jcCrimson)" filter="url(#crimsonGlow)"/>
</svg>
